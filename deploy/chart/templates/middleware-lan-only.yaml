# Traefik routes by Host header alone, so a host whose DNS points at a LAN IP is still reachable
# through the public IP. The Ingress attaches this to refuse anyone outside the LAN.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
      - {{ required "network.lanCidr is required (site.yaml)" .Values.network.lanCidr }}
